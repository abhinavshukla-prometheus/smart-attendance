<!DOCTYPE html>
<html>
<head>
    <title>Attendance Records</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #eee; padding: 1.5rem; }
        .topbar { display: flex; justify-content: space-between; max-width: 700px; margin: 0 auto 1.5rem auto; align-items: center; }
        .topbar a { color: #9ad; text-decoration: none; margin-left: 1rem; }
        .wrap { max-width: 700px; margin: 0 auto; }
        form { margin-bottom: 1rem; display: flex; gap: 0.6rem; align-items: center; }
        input[type="date"] { padding: 0.4rem; border-radius: 4px; border: 1px solid #333; background: #1c1c1c; color: #eee; }
        button, .export-btn { padding: 0.45rem 0.9rem; border-radius: 4px; border: none; background: #2e7d32; color: white; cursor: pointer; text-decoration: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.5rem 0.7rem; text-align: left; border-bottom: 1px solid #333; }
        th { color: #9ad; }
        .empty { color: #888; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="topbar">
        <span>Logged in as {{ username }}</span>
        <span>
            <a href="{{ url_for('attendance.index') }}">Live Feed</a>
            <a href="{{ url_for('auth.logout') }}">Log out</a>
        </span>
    </div>

    <div class="wrap">
        <h2>Attendance - {{ selected_date }}</h2>

        <form method="GET">
            <input type="date" name="date" value="{{ selected_date }}">
            <button type="submit">Filter</button>
            <a class="export-btn" href="{{ url_for('attendance.export_csv', date=selected_date) }}">Export CSV</a>
        </form>

        {% if rows %}
        <table>
            <tr><th>Name</th><th>Time In</th><th>Status</th></tr>
            {% for row in rows %}
            <tr>
                <td>{{ row.name }}</td>
                <td>{{ row.time_in }}</td>
                <td>{{ row.status }}</td>
            </tr>
            {% endfor %}
        </table>
        {% else %}
        <p class="empty">No attendance recorded for this date.</p>
        {% endif %}
    </div>
</body>
</html>
